name: Simple CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Backend: install & test
        working-directory: server
        run: |
          npm ci
          npm test

      - name: Frontend: install & test
        working-directory: client
        run: |
          npm ci
          npm test

      - name: Build frontend
        working-directory: client
        run: npm run build
