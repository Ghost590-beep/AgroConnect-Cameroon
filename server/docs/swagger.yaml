openapi: 3.0.0
info:
  title: AgroConnect API
  version: 1.0.0
  description: API documentation for AgroConnect backend
servers:
  - url: http://localhost:5000/api
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas: {}
paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - full_name
                - email
                - password
                - phone
                - location
              properties:
                full_name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                phone:
                  type: string
                location:
                  type: string
      responses:
        "201":
          description: User registered successfully
        "400":
          description: Validation error
  /auth/login:
    post:
      tags:
        - Auth
      summary: Login a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Login successful
        "400":
          description: Validation error
  /products:
    get:
      tags:
        - Products
      summary: Get all products
      responses:
        "200":
          description: Product list returned (only public/non-draft products)
    post:
      tags:
        - Products
      summary: Add a new product
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - price
                - categoryId
                - description
              properties:
                name:
                  type: string
                price:
                  type: number
                categoryId:
                  type: integer
                description:
                  type: string
      responses:
        "201":
          description: Product created successfully
        "401":
          description: Authentication required
  /products/{id}:
    get:
      tags:
        - Products
      summary: Get a product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product returned
        "404":
          description: Product not found

  /users/profile/avatar:
    post:
      tags:
        - Users
      summary: Upload user avatar
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Avatar uploaded and user profile updated
        "400":
          description: No file provided or validation error
        "401":
          description: Authentication required
